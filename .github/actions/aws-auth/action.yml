name: AWS authentication
description: >
  Authenticate to AWS in us-east-1. Prefers OIDC (role-arn). Falls back to long-lived access keys
  passed in as inputs from GitHub secrets. Never prints credentials or account identifiers.

inputs:
  role-arn:
    description: IAM role ARN to assume via OIDC (repo variables AWS_PLAN_ROLE_ARN / AWS_APPLY_ROLE_ARN, or AWS_ROLE_ARN). Empty = use access keys.
    required: false
    default: ""
  access-key-id:
    description: Fallback - value of secret AWS_ACCESS_KEY_ID.
    required: false
    default: ""
  secret-access-key:
    description: Fallback - value of secret AWS_SECRET_ACCESS_KEY.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Check that some AWS credential source is configured
      shell: bash
      env:
        ROLE_ARN: ${{ inputs.role-arn }}
        AK: ${{ inputs.access-key-id }}
        SK: ${{ inputs.secret-access-key }}
      run: |
        if [ -n "$ROLE_ARN" ]; then
          # Format check only. It cannot prove the role exists or that its trust policy allows this run;
          # only the assume-role call below can show that.
          if ! printf '%s' "$ROLE_ARN" | grep -Eq '^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$'; then
            echo "::error title=Malformed role ARN::The configured role ARN is not of the form arn:aws:iam::<12-digit account>:role/<name>."
            exit 1
          fi
          echo "Auth mode: OIDC role assumption (preferred)"
        elif [ -n "$AK" ] && [ -n "$SK" ]; then
          echo "::warning title=Long-lived AWS keys::Using GitHub secrets AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY. Prefer OIDC (see docs/GITHUB_ACTIONS.md)."
        else
          echo "::error title=No AWS credentials configured::Set repository variable AWS_ROLE_ARN (OIDC, preferred) or secrets AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY. See docs/GITHUB_ACTIONS.md."
          exit 1
        fi

    - name: Configure AWS credentials (OIDC)
      if: ${{ inputs.role-arn != '' }}
      uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: us-east-1
        role-session-name: gha-terraform-${{ github.run_id }}

    - name: Configure AWS credentials (access keys)
      if: ${{ inputs.role-arn == '' }}
      uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
      with:
        aws-access-key-id: ${{ inputs.access-key-id }}
        aws-secret-access-key: ${{ inputs.secret-access-key }}
        aws-region: us-east-1

    - name: Verify credentials work (identity is not printed)
      shell: bash
      run: |
        aws sts get-caller-identity --query Arn --output text > /dev/null
        echo "AWS credentials accepted by STS in us-east-1."
