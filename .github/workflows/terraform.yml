name: Terraform CI

# Checks on every PR/push; plan on PRs (same-repo) and on manual dispatch.
# This workflow NEVER applies or destroys. See terraform-apply.yml / terraform-destroy.yml.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.16.2" # the version this repo was validated with locally
  CHECKOV_VERSION: "3.3.29"
  TF_IN_AUTOMATION: "true"
  AWS_REGION: us-east-1

jobs:
  repository-checks:
    name: "1 - Repository checks"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Required files exist
        run: |
          missing=0
          for f in versions.tf variables.tf outputs.tf .gitignore README.md terraform.tfvars.example \
                   docs/ARCHITECTURE.md docs/TROUBLESHOOTING.md docs/COST_AND_CLEANUP.md \
                   docs/VALIDATION_REPORT.md docs/GITHUB_ACTIONS.md docs/PUBLISHING_CHECKLIST.md LICENSE .tflint.hcl scripts/check_links.py; do
            if [ -f "$f" ]; then echo "ok       $f"; else echo "::error file=$f::Required file is missing"; missing=1; fi
          done
          exit $missing

      - name: No forbidden files committed (state, plans, tfvars, keys)
        run: |
          bad=$(git ls-files | grep -E '(\.tfstate(\.|$)|\.tfplan$|^tfplan$|(^|/)terraform\.tfvars$|\.auto\.tfvars$|\.pem$|(^|/)id_rsa)' || true)
          if [ -n "$bad" ]; then
            echo "::error::Forbidden files are tracked by git:"; echo "$bad"; exit 1
          fi
          echo "No forbidden files tracked."

      - name: Scan for obvious credential patterns (file names only, contents never printed)
        run: |
          # Bracket tricks keep this workflow from matching its own patterns.
          hits=$(grep -rIlE --exclude-dir=.git --exclude-dir=.terraform \
            -e 'AKI[A][0-9A-Z]{16}' -e 'ASI[A][0-9A-Z]{16}' \
            -e 'BEGIN [A-Z ]*PRIVATE KE[Y]' \
            -e 'aws_secret_access_ke[y][[:space:]]*=' . || true)
          if [ -n "$hits" ]; then
            echo "::error::Possible credentials found in these files (contents not shown):"
            echo "$hits"
            exit 1
          fi
          echo "No obvious credential patterns found."

      - name: Relative Markdown links resolve
        run: python3 scripts/check_links.py

      - name: File inventory
        run: find . -type f -not -path './.git/*' -not -path './.terraform/*' | sort

  terraform-format:
    name: "2 - Terraform format"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform fmt -check
        run: |
          if ! terraform fmt -check -recursive -diff -no-color; then
            echo "::error title=Formatting::The files listed above are not formatted. Run 'terraform fmt -recursive' locally and commit."
            exit 1
          fi

  terraform-init-validate:
    name: "3 - Terraform init, validate, lint & test"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Versions
        run: terraform version
      - name: terraform init (no backend, lock file must already be complete)
        run: terraform init -backend=false -input=false -no-color -lockfile=readonly
      - name: Provider versions
        run: terraform providers -no-color
      - name: terraform validate
        run: terraform validate -no-color
      - name: terraform test (mocked providers, no AWS access)
        run: terraform test -no-color
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0
      - name: TFLint (terraform + AWS rulesets)
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids anonymous GitHub API rate limits while installing the ruleset
        run: |
          tflint --init
          tflint --recursive --format compact

  terraform-security-scan:
    name: "4 - Security scan (Checkov)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Checkov (pinned)
        run: pip install --disable-pip-version-check "checkov==${CHECKOV_VERSION}"
      - name: Checkov (terraform framework)
        run: |
          # Suppressions live next to the code with a written reason (#checkov:skip=...).
          checkov -d . --framework terraform --compact --quiet --skip-download

  terraform-plan:
    name: "5 - Terraform plan"
    needs: [terraform-init-validate, terraform-security-scan]
    # Fork PRs get neither secrets nor OIDC, so they skip planning.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC token for aws-actions/configure-aws-credentials
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Authenticate to AWS
        uses: ./.github/actions/aws-auth
        with:
          role-arn: ${{ vars.AWS_ROLE_ARN }}
          access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Optional inputs from repository variables
        env:
          V_DOMAIN: ${{ vars.TF_VAR_DOMAIN_NAME }}
          V_ZONE: ${{ vars.TF_VAR_HOSTED_ZONE_NAME }}
        run: |
          # Only export when non-empty: an empty string would be a non-null (invalid) domain.
          [ -n "$V_DOMAIN" ] && echo "TF_VAR_domain_name=$V_DOMAIN" >> "$GITHUB_ENV"
          [ -n "$V_ZONE" ] && echo "TF_VAR_hosted_zone_name=$V_ZONE" >> "$GITHUB_ENV"
          exit 0

      - name: terraform init
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          STATE_KEY: ${{ vars.TF_STATE_KEY }}
        run: |
          if [ -n "$STATE_BUCKET" ]; then
            cp backend.tf.example backend.tf
            terraform init -input=false -no-color \
              -backend-config="bucket=$STATE_BUCKET" \
              -backend-config="key=${STATE_KEY:-ha-web/lab/terraform.tfstate}" \
              -backend-config="region=us-east-1"
          else
            echo "::warning title=No remote state::Repository variable TF_STATE_BUCKET is unset. This plan starts from EMPTY state, so it shows everything as 'create'. Fine for a review; apply is blocked without remote state."
            terraform init -input=false -no-color
          fi

      - name: terraform plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock=false -out=tfplan 2>&1 | tee plan.log
          # -lock=false: a PR plan only reads state, so it must not contend with (or strand a lock
          # for) a running apply. Sensitive values are rendered by Terraform as "(sensitive value)". The binary tfplan is
          # deliberately NOT uploaded; it may hold secrets.

      - name: Plan summary
        if: always()
        run: |
          {
            echo "### Terraform plan (us-east-1)"
            echo '```'
            grep -E '^(Plan:|No changes|Error:)' plan.log || echo "(no plan summary line found - see the step log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized plan log (text only, 7 days)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: terraform-plan-log
          path: plan.log
          retention-days: 7
          if-no-files-found: ignore

  workflow-summary:
    name: "6 - Workflow summary"
    needs:
      - repository-checks
      - terraform-format
      - terraform-init-validate
      - terraform-security-scan
      - terraform-plan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize results
        env:
          R_REPO: ${{ needs.repository-checks.result }}
          R_FMT: ${{ needs.terraform-format.result }}
          R_VAL: ${{ needs.terraform-init-validate.result }}
          R_SEC: ${{ needs.terraform-security-scan.result }}
          R_PLAN: ${{ needs.terraform-plan.result }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          icon() { case "$1" in success) echo "✅";; skipped) echo "⏭️";; cancelled) echo "🚫";; *) echo "❌";; esac; }
          {
            echo "## Terraform CI summary"
            echo ""
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| 1 - Repository checks | $(icon "$R_REPO") $R_REPO |"
            echo "| 2 - Terraform format | $(icon "$R_FMT") $R_FMT |"
            echo "| 3 - Init, validate & test | $(icon "$R_VAL") $R_VAL |"
            echo "| 4 - Security scan | $(icon "$R_SEC") $R_SEC |"
            echo "| 5 - Plan | $(icon "$R_PLAN") $R_PLAN |"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Branch: \`${BRANCH}\`"
            echo "- Region: \`us-east-1\`"
            echo "- Logs: ${RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

          fail=0
          for r in "$R_REPO" "$R_FMT" "$R_VAL" "$R_SEC" "$R_PLAN"; do
            case "$r" in success|skipped) ;; *) fail=1;; esac
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error title=Workflow failed::At least one job failed or was cancelled. See the table in the run summary."
            exit 1
          fi
          echo "All jobs succeeded (or were intentionally skipped, e.g. plan on fork PRs)."
