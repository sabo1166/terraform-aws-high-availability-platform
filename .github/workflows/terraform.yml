name: Terraform CI

# Push / PR: jobs 3-4 (and 5 on same-repo PRs). Manual run with "apply" ticked: jobs 3-6.
# Apply never runs on push or PR. Teardown is a separate manual workflow (terraform-destroy.yml).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apply:
        description: Apply after a successful plan (BILLABLE; main only; needs remote state)
        type: boolean
        default: false
      confirmation:
        description: 'Required when apply is ticked. Type exactly: APPLY us-east-1'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # never cancel a push or a running apply

env:
  TF_VERSION: "1.16.2" # the version this repo was validated with locally
  CHECKOV_VERSION: "3.3.29"
  TF_IN_AUTOMATION: "true"
  AWS_REGION: us-east-1

jobs:
  terraform-init-validate:
    name: "3 - Terraform init, validate, lint & test"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Versions
        run: terraform version
      - name: terraform fmt -check
        run: |
          if ! terraform fmt -check -recursive -diff -no-color; then
            echo "::error title=Formatting::The files listed above are not formatted. Run 'terraform fmt -recursive' locally and commit."
            exit 1
          fi
      - name: terraform init (no backend, lock file must already be complete)
        run: terraform init -backend=false -input=false -no-color -lockfile=readonly
      - name: Provider versions
        run: terraform providers -no-color
      - name: terraform validate
        run: terraform validate -no-color
      - name: terraform test (mocked providers, no AWS access)
        run: terraform test -no-color
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0
      - name: TFLint (terraform + AWS rulesets)
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids anonymous GitHub API rate limits while installing the ruleset
        run: |
          tflint --init
          tflint --recursive --format compact

  terraform-security-scan:
    name: "4 - Security scan (Checkov)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Checkov (pinned)
        run: pip install --disable-pip-version-check "checkov==${CHECKOV_VERSION}"
      - name: Checkov (terraform framework)
        run: |
          # Suppressions live next to the code with a written reason (#checkov:skip=...).
          checkov -d . --framework terraform --compact --quiet --skip-download

  terraform-plan:
    name: "5 - Terraform plan"
    needs: [terraform-init-validate, terraform-security-scan]
    # Fork PRs get neither secrets nor OIDC, so they skip planning.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC token for aws-actions/configure-aws-credentials
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Authenticate to AWS
        uses: ./.github/actions/aws-auth
        with:
          role-arn: ${{ vars.AWS_ROLE_ARN }}
          access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Optional inputs from repository variables
        env:
          V_DOMAIN: ${{ vars.TF_VAR_DOMAIN_NAME }}
          V_ZONE: ${{ vars.TF_VAR_HOSTED_ZONE_NAME }}
        run: |
          # Only export when non-empty: an empty string would be a non-null (invalid) domain.
          [ -n "$V_DOMAIN" ] && echo "TF_VAR_domain_name=$V_DOMAIN" >> "$GITHUB_ENV"
          [ -n "$V_ZONE" ] && echo "TF_VAR_hosted_zone_name=$V_ZONE" >> "$GITHUB_ENV"
          exit 0

      - name: terraform init
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          STATE_KEY: ${{ vars.TF_STATE_KEY }}
        run: |
          if [ -n "$STATE_BUCKET" ]; then
            cp backend.tf.example backend.tf
            terraform init -input=false -no-color \
              -backend-config="bucket=$STATE_BUCKET" \
              -backend-config="key=${STATE_KEY:-ha-web/lab/terraform.tfstate}" \
              -backend-config="region=us-east-1"
          else
            echo "::warning title=No remote state::Repository variable TF_STATE_BUCKET is unset. This plan starts from EMPTY state, so it shows everything as 'create'. Apply is blocked without remote state."
            terraform init -input=false -no-color
          fi

      - name: terraform plan
        run: |
          set -o pipefail
          # -lock=false: a plan only reads state, so it must not contend with (or strand a lock for)
          # a running apply. Sensitive values print as "(sensitive value)". The binary plan file is
          # deliberately NOT uploaded; it may hold secrets.
          terraform plan -input=false -no-color -lock=false 2>&1 | tee plan.log

      - name: Plan summary
        if: always()
        run: |
          {
            echo "### Terraform plan (us-east-1)"
            echo '```'
            grep -E '^(Plan:|No changes|Error:)' plan.log || echo "(no plan summary line found - see the step log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized plan log (text only, 7 days)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: terraform-plan-log
          path: plan.log
          retention-days: 7
          if-no-files-found: ignore

  terraform-apply:
    name: "6 - Terraform apply (auto-approve)"
    needs: [terraform-plan]
    # Only a manual run with "apply" ticked. Never on push or pull_request.
    if: github.event_name == 'workflow_dispatch' && inputs.apply
    runs-on: ubuntu-latest
    timeout-minutes: 90 # Multi-AZ RDS + CloudFront can take 30+ minutes
    environment: lab # required-reviewer gate lives here (create it with reviewers; see docs/GITHUB_ACTIONS.md)
    concurrency:
      group: terraform-state-lab
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check branch and confirmation phrase
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error title=Wrong branch::Apply may only run from main (got $REF)."; exit 1
          fi
          if [ "$CONFIRMATION" != "APPLY us-east-1" ]; then
            echo "::error title=Confirmation mismatch::Type exactly: APPLY us-east-1"; exit 1
          fi

      - name: Require remote state
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          if [ -z "$STATE_BUCKET" ]; then
            echo "::error title=Remote state required::Set repository variable TF_STATE_BUCKET. Applying with runner-local state would orphan the resources."
            exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Authenticate to AWS
        uses: ./.github/actions/aws-auth
        with:
          role-arn: ${{ vars.AWS_ROLE_ARN }}
          access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Optional inputs from repository variables
        env:
          V_DOMAIN: ${{ vars.TF_VAR_DOMAIN_NAME }}
          V_ZONE: ${{ vars.TF_VAR_HOSTED_ZONE_NAME }}
        run: |
          [ -n "$V_DOMAIN" ] && echo "TF_VAR_domain_name=$V_DOMAIN" >> "$GITHUB_ENV"
          [ -n "$V_ZONE" ] && echo "TF_VAR_hosted_zone_name=$V_ZONE" >> "$GITHUB_ENV"
          exit 0

      - name: terraform init
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          STATE_KEY: ${{ vars.TF_STATE_KEY }}
        run: |
          cp backend.tf.example backend.tf
          terraform init -input=false -no-color \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=${STATE_KEY:-ha-web/lab/terraform.tfstate}" \
            -backend-config="region=us-east-1"

      - name: terraform apply -auto-approve
        run: terraform apply -input=false -no-color -auto-approve -lock-timeout=120s

      - name: Public URL
        run: |
          echo "### Applied" >> "$GITHUB_STEP_SUMMARY"
          echo "Public URL: $(terraform output -raw public_url)" >> "$GITHUB_STEP_SUMMARY"
