name: Terraform CI

# Pull request to main : jobs 1-4 only (static checks). No AWS access, no plan, no apply.
# Push to main         : jobs 1-4, then 5 (plan) and, if the plan has changes, 6 (apply of THAT plan,
#                        after approval on the "lab" Environment).
# Manual dispatch      : jobs 1-5 from the default branch (plan only; never applies).
# Job 7 always reports. A "skipped" job is not a failed job; see scripts/check_workflows.py for the
# tested event/dependency matrix. Destroy is a separate manual workflow (terraform-destroy.yml).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # never cancel a push run: it may be applying

env:
  TF_VERSION: "1.16.2" # the version this repo was validated with locally
  CHECKOV_VERSION: "3.3.29"
  TF_IN_AUTOMATION: "true"
  AWS_REGION: us-east-1

jobs:
  repository-checks:
    name: "1 - Repository & configuration checks"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install PyYAML (pinned) for the workflow policy test
        run: pip install --disable-pip-version-check "pyyaml==6.0.2"

      - name: Required files exist
        run: |
          missing=0
          for f in versions.tf variables.tf outputs.tf .gitignore .gitattributes README.md terraform.tfvars.example \
                   docs/ARCHITECTURE.md docs/TROUBLESHOOTING.md docs/COST_AND_CLEANUP.md \
                   docs/VALIDATION_REPORT.md docs/GITHUB_ACTIONS.md docs/PUBLISHING_CHECKLIST.md \
                   LICENSE .tflint.hcl backend.tf backend.tfbackend.example docs/REMOTE_STATE.md \
                   scripts/check_links.py scripts/check_workflows.py scripts/check_state_bucket.sh \
                   scripts/check_state_vs_infra.sh tests/state_scripts_test.sh \
                   scripts/build_visuals.py docs/ROADMAP.md docs/architecture.svg docs/roadmap.svg \
                   docs/roadmap/index.html docs/roadmap/styles.css docs/roadmap/app.js docs/roadmap/data.js \
                   docs/roadmap/roadmap.json docs/roadmap/flow.json; do
            if [ -f "$f" ]; then echo "ok       $f"; else echo "::error file=$f::Required file is missing"; missing=1; fi
          done
          exit $missing

      - name: No forbidden files committed (state, plans, tfvars, keys)
        run: |
          bad=$(git ls-files | grep -E '(\.tfstate(\.|$)|\.tfplan$|^tfplan$|(^|/)terraform\.tfvars$|\.auto\.tfvars$|\.pem$|(^|/)id_rsa)' || true)
          if [ -n "$bad" ]; then
            echo "::error::Forbidden files are tracked by git:"; echo "$bad"; exit 1
          fi
          echo "No forbidden files tracked."

      - name: Scan for obvious credential patterns (file names only, contents never printed)
        run: |
          # Bracket tricks keep this workflow from matching its own patterns.
          hits=$(grep -rIlE --exclude-dir=.git --exclude-dir=.terraform \
            -e 'AKI[A][0-9A-Z]{16}' -e 'ASI[A][0-9A-Z]{16}' \
            -e 'BEGIN [A-Z ]*PRIVATE KE[Y]' \
            -e 'aws_secret_access_ke[y][[:space:]]*=' . || true)
          if [ -n "$hits" ]; then
            echo "::error::Possible credentials found in these files (contents not shown):"
            echo "$hits"
            exit 1
          fi
          echo "No obvious credential patterns found."

      - name: Relative Markdown links resolve
        run: python scripts/check_links.py

      - name: Workflow policy and event/dependency matrix
        run: python scripts/check_workflows.py

      - name: Remote-state guard scripts (fake AWS CLI; no AWS access)
        run: bash tests/state_scripts_test.sh

      - name: Diagrams match the Terraform, assets are well-formed (SVG, HTML, CSS, JS)
        run: |
          python scripts/build_visuals.py --check
          node --check docs/roadmap/app.js

  terraform-format:
    name: "2 - Terraform format"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform fmt -check
        run: |
          if ! terraform fmt -check -recursive -diff -no-color; then
            echo "::error title=Formatting::The files listed above are not formatted. Run 'terraform fmt -recursive' locally and commit."
            exit 1
          fi

  terraform-init-validate:
    name: "3 - Terraform init, validate, lint & test"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Versions
        run: terraform version
      - name: terraform init (no backend, lock file must already be complete)
        run: terraform init -backend=false -input=false -no-color -lockfile=readonly
      - name: Provider versions
        run: terraform providers -no-color
      - name: terraform validate
        run: terraform validate -no-color
      - name: terraform test (mocked providers, no AWS access)
        run: terraform test -no-color
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0
      - name: TFLint (terraform + AWS rulesets)
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids anonymous GitHub API rate limits while installing the ruleset
        run: |
          tflint --init
          tflint --recursive --format compact

  terraform-security-scan:
    name: "4 - Security scan (Checkov)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Checkov (pinned)
        run: pip install --disable-pip-version-check "checkov==${CHECKOV_VERSION}"
      - name: Checkov (terraform framework)
        run: |
          # Suppressions live next to the code with a written reason (#checkov:skip=...).
          checkov -d . --framework terraform --compact --quiet --skip-download

  terraform-plan:
    name: "5 - Terraform plan"
    # No always(): a failed or skipped prerequisite skips this job. Pull requests never reach it.
    needs: [repository-checks, terraform-format, terraform-init-validate, terraform-security-scan]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC token for aws-actions/configure-aws-credentials
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
      plan_sha256: ${{ steps.package.outputs.plan_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Check required configuration before touching AWS
        env:
          EVENT: ${{ github.event_name }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          PLAN_KEY: ${{ secrets.TF_PLAN_ENCRYPTION_KEY }}
        run: |
          # Every AWS-backed run uses the shared S3 state. There is no local or empty-state path.
          if [ -z "$STATE_BUCKET" ]; then
            echo "::error title=Remote state required::Set repository variable TF_STATE_BUCKET to an existing, private, versioned S3 bucket (docs/REMOTE_STATE.md). CI never plans against an empty or local state."; exit 1
          fi
          if [ "$EVENT" = "push" ] && [ -z "$PLAN_KEY" ]; then
            echo "::error title=Plan encryption key missing::Set repository secret TF_PLAN_ENCRYPTION_KEY (e.g. output of: openssl rand -base64 48). The plan file can contain secrets and is never uploaded unencrypted."; exit 1
          fi
          echo "Configuration present."

      - name: Authenticate to AWS (plan role)
        uses: ./.github/actions/aws-auth
        with:
          role-arn: ${{ vars.AWS_PLAN_ROLE_ARN || vars.AWS_ROLE_ARN }}
          access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Optional inputs from repository variables
        env:
          V_DOMAIN: ${{ vars.TF_VAR_DOMAIN_NAME }}
          V_ZONE: ${{ vars.TF_VAR_HOSTED_ZONE_NAME }}
        run: |
          # Only export when non-empty: an empty string would be a non-null (invalid) domain.
          [ -n "$V_DOMAIN" ] && echo "TF_VAR_domain_name=$V_DOMAIN" >> "$GITHUB_ENV"
          [ -n "$V_ZONE" ] && echo "TF_VAR_hosted_zone_name=$V_ZONE" >> "$GITHUB_ENV"
          exit 0

      - name: Initialise the S3 backend
        uses: ./.github/actions/terraform-backend
        with:
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
          state-key: ${{ vars.TF_STATE_KEY }}
          state-region: ${{ vars.TF_STATE_REGION }}

      - name: terraform plan
        id: plan
        run: |
          # -lock=false: planning only reads state and must not block (or strand a lock for) an apply.
          # -detailed-exitcode: 0 = no changes, 2 = changes, 1 = error.
          set +e
          terraform plan -input=false -no-color -lock=false -detailed-exitcode -out=tfplan > plan.log 2>&1
          rc=$?
          set -e
          case "$rc" in
            0) echo "has_changes=false" >> "$GITHUB_OUTPUT"; echo "No changes. Infrastructure matches the configuration." ;;
            2) echo "has_changes=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error title=terraform plan failed::Exit code $rc. Last lines of the Terraform output follow (sensitive values are masked by Terraform)."
              tail -n 60 plan.log
              exit 1
              ;;
          esac

      - name: Plan summary (resource addresses and actions only; no attribute values)
        if: steps.plan.outputs.has_changes == 'true'
        run: |
          {
            echo "### Terraform plan (us-east-1)"
            echo '```'
            grep -E '^Plan:' plan.log || true
            terraform show -json tfplan \
              | jq -r '.resource_changes[]? | select((.change.actions | join(",")) as $a | $a != "no-op" and $a != "read") | "\(.change.actions | join("+"))  \(.address)"' \
              | head -n 200
            echo '```'
            echo "Full plan values are intentionally not shown. They are in the encrypted plan artifact that job 6 applies."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Encrypt plan (the plan file can contain secret state values)
        id: package
        if: steps.plan.outputs.has_changes == 'true' && github.event_name == 'push'
        env:
          PLAN_KEY: ${{ secrets.TF_PLAN_ENCRYPTION_KEY }}
        run: |
          printf 'sha=%s\nrun_id=%s\nrun_attempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > plan.meta
          tar -cf plan.tar tfplan plan.meta
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:PLAN_KEY -in plan.tar -out plan.tar.enc
          # The digest travels as a job output (a different channel from the artifact), so job 6 can
          # detect a swapped or corrupted artifact.
          echo "plan_sha256=$(sha256sum plan.tar.enc | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          rm -f plan.tar

      - name: Upload encrypted plan artifact (runs only after a successful plan)
        if: steps.plan.outputs.has_changes == 'true' && github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tfplan-${{ github.sha }}-${{ github.run_id }}
          path: plan.tar.enc
          retention-days: 5
          if-no-files-found: error

  terraform-apply:
    name: "6 - Terraform apply (saved plan)"
    # Never on pull_request. Only a push to the default branch, only when job 5 found changes.
    needs: [terraform-plan]
    if: >-
      github.event_name == 'push' &&
      github.ref_name == github.event.repository.default_branch &&
      needs.terraform-plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90 # Multi-AZ RDS + CloudFront can take 30+ minutes
    environment: lab # required reviewers must be configured on this Environment (docs/GITHUB_ACTIONS.md)
    concurrency:
      group: terraform-state-lab
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Download the plan produced by this run
        id: download
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tfplan-${{ github.sha }}-${{ github.run_id }}

      - name: Verify, decrypt and unpack the plan
        env:
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          EXPECTED_SHA256: ${{ needs.terraform-plan.outputs.plan_sha256 }}
          PLAN_KEY: ${{ secrets.TF_PLAN_ENCRYPTION_KEY }}
        run: |
          if [ "$DOWNLOAD_OUTCOME" != "success" ] || [ ! -f plan.tar.enc ]; then
            echo "::error title=Plan artifact missing::No artifact tfplan-${GITHUB_SHA}-${GITHUB_RUN_ID}. It expires after 5 days, so re-run the whole workflow to produce a fresh plan. Nothing was applied."; exit 1
          fi
          actual=$(sha256sum plan.tar.enc | cut -d' ' -f1)
          if [ -z "$EXPECTED_SHA256" ] || [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error title=Plan artifact digest mismatch::The downloaded artifact is not the one job 5 produced. Nothing was applied."; exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:PLAN_KEY -in plan.tar.enc | tar -xf -
          # shellcheck disable=SC1091
          . ./plan.meta
          if [ "$sha" != "$GITHUB_SHA" ] || [ "$run_id" != "$GITHUB_RUN_ID" ]; then
            echo "::error title=Plan is for a different commit or run::Plan sha=$sha run=$run_id, this run is $GITHUB_SHA / $GITHUB_RUN_ID. Nothing was applied."; exit 1
          fi
          echo "Plan verified: same commit and same run as this job."

      - name: Authenticate to AWS (apply role)
        uses: ./.github/actions/aws-auth
        with:
          role-arn: ${{ vars.AWS_APPLY_ROLE_ARN || vars.AWS_ROLE_ARN }}
          access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Initialise the S3 backend (same bucket, key and lock file as the plan)
        uses: ./.github/actions/terraform-backend
        with:
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
          state-key: ${{ vars.TF_STATE_KEY }}
          state-region: ${{ vars.TF_STATE_REGION }}

      - name: terraform apply (exactly the saved plan)
        # Applying a plan file needs no -auto-approve and cannot silently produce a different plan:
        # Terraform refuses it if state changed since it was created ("Saved plan is stale").
        run: terraform apply -input=false -no-color -lock-timeout=120s tfplan

      - name: Public URL
        run: |
          {
            echo "### Applied commit ${GITHUB_SHA}"
            echo "Public URL: $(terraform output -raw public_url)"
          } >> "$GITHUB_STEP_SUMMARY"

  workflow-summary:
    name: "7 - Workflow summary"
    needs:
      - repository-checks
      - terraform-format
      - terraform-init-validate
      - terraform-security-scan
      - terraform-plan
      - terraform-apply
    if: always() # reporting only; it never plans or applies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize results and name the first failing prerequisite
        env:
          R_REPO: ${{ needs.repository-checks.result }}
          R_FMT: ${{ needs.terraform-format.result }}
          R_VAL: ${{ needs.terraform-init-validate.result }}
          R_SEC: ${{ needs.terraform-security-scan.result }}
          R_PLAN: ${{ needs.terraform-plan.result }}
          R_APPLY: ${{ needs.terraform-apply.result }}
          HAS_CHANGES: ${{ needs.terraform-plan.outputs.has_changes }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          icon() { case "$1" in success) echo "✅ success";; skipped) echo "⏭️ skipped";; cancelled) echo "🚫 cancelled";; *) echo "❌ $1";; esac; }

          # Why a skipped job was skipped, in plain words.
          prereq_ok=true
          for r in "$R_REPO" "$R_FMT" "$R_VAL" "$R_SEC"; do [ "$r" = "success" ] || prereq_ok=false; done
          if [ "$R_PLAN" != "skipped" ]; then plan_note=""
          elif [ "$prereq_ok" != "true" ]; then plan_note="a required check did not succeed"
          elif [ "$EVENT" = "pull_request" ]; then plan_note="by design: pull requests run static checks only"
          else plan_note="not the default branch"; fi
          if [ "$R_APPLY" != "skipped" ]; then apply_note=""
          elif [ "$R_PLAN" != "success" ]; then apply_note="plan did not succeed"
          elif [ "$EVENT" != "push" ]; then apply_note="by design: apply runs only on a push to the default branch"
          elif [ "$HAS_CHANGES" = "false" ]; then apply_note="plan found no changes"
          else apply_note="not the default branch"; fi

          {
            echo "## Terraform CI summary"
            echo ""
            echo "| Job | Result | Note |"
            echo "|---|---|---|"
            echo "| 1 - Repository & configuration checks | $(icon "$R_REPO") | |"
            echo "| 2 - Terraform format | $(icon "$R_FMT") | |"
            echo "| 3 - Init, validate, lint & test | $(icon "$R_VAL") | |"
            echo "| 4 - Security scan (Checkov) | $(icon "$R_SEC") | |"
            echo "| 5 - Terraform plan | $(icon "$R_PLAN") | $plan_note |"
            echo "| 6 - Terraform apply | $(icon "$R_APPLY") | $apply_note |"
            echo ""
            echo "- Event: \`${EVENT}\`, ref: \`${BRANCH}\`, commit: \`${GITHUB_SHA}\`, region: \`us-east-1\`"
            echo "- Logs: ${RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

          # First failing job in dependency order. "skipped" is never counted as a failure.
          first=""
          for pair in "1 - Repository & configuration checks:$R_REPO" "2 - Terraform format:$R_FMT" \
                      "3 - Init, validate, lint & test:$R_VAL" "4 - Security scan (Checkov):$R_SEC" \
                      "5 - Terraform plan:$R_PLAN" "6 - Terraform apply:$R_APPLY"; do
            name=${pair%:*}; res=${pair##*:}
            case "$res" in success|skipped) ;; *) first="$name ($res)"; break;; esac
          done
          if [ -n "$first" ]; then
            echo "::error title=First failing prerequisite::$first. Later skipped jobs were skipped because of it."
            exit 1
          fi
          echo "No job failed. Skipped jobs are skipped by design or because nothing needed to run."
