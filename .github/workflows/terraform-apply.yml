name: Terraform Apply (manual)

# BILLABLE. Manual only. Requires: run from main, exact confirmation phrase, remote state, and
# approval by the GitHub Environment's required reviewers (configure them - see docs/GITHUB_ACTIONS.md).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to deploy (must exist, with required reviewers)
        type: choice
        options: [lab]
        default: lab
      confirmation:
        description: 'Type exactly: APPLY us-east-1'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: terraform-state-${{ inputs.environment }}
  cancel-in-progress: false # never cancel a running apply

env:
  TF_VERSION: "1.16.2"
  TF_IN_AUTOMATION: "true"
  AWS_REGION: us-east-1

jobs:
  validate-inputs:
    name: "1 - Validate inputs"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check branch and confirmation phrase
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error title=Wrong branch::Apply may only run from main (got $REF)."; exit 1
          fi
          if [ "$CONFIRMATION" != "APPLY us-east-1" ]; then
            echo "::error title=Confirmation mismatch::Type exactly: APPLY us-east-1"; exit 1
          fi
          echo "Inputs valid."

  apply:
    name: "2 - Plan & apply"
    needs: validate-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 90 # Multi-AZ RDS + CloudFront can take 30+ minutes
    environment: ${{ inputs.environment }} # required-reviewer gate lives here
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Require remote state
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          if [ -z "$STATE_BUCKET" ]; then
            echo "::error title=Remote state required::Set repository variable TF_STATE_BUCKET. Applying with runner-local state would orphan the resources."
            exit 1
          fi

      - name: Authenticate to AWS
        uses: ./.github/actions/aws-auth
        with:
          role-arn: ${{ vars.AWS_ROLE_ARN }}
          access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Optional inputs from repository variables
        env:
          V_DOMAIN: ${{ vars.TF_VAR_DOMAIN_NAME }}
          V_ZONE: ${{ vars.TF_VAR_HOSTED_ZONE_NAME }}
        run: |
          [ -n "$V_DOMAIN" ] && echo "TF_VAR_domain_name=$V_DOMAIN" >> "$GITHUB_ENV"
          [ -n "$V_ZONE" ] && echo "TF_VAR_hosted_zone_name=$V_ZONE" >> "$GITHUB_ENV"
          exit 0

      - name: terraform init
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          STATE_KEY: ${{ vars.TF_STATE_KEY }}
        run: |
          cp backend.tf.example backend.tf
          terraform init -input=false -no-color \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=${STATE_KEY:-ha-web/lab/terraform.tfstate}" \
            -backend-config="region=us-east-1"

      - name: terraform plan
        run: terraform plan -input=false -no-color -lock-timeout=120s -out=tfplan

      - name: terraform apply (exactly the plan above)
        run: terraform apply -input=false -no-color -lock-timeout=120s tfplan

      - name: Public URL
        run: |
          echo "### Applied" >> "$GITHUB_STEP_SUMMARY"
          echo "Public URL: $(terraform output -raw public_url)" >> "$GITHUB_STEP_SUMMARY"
